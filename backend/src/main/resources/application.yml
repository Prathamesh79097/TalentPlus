server:
  port: ${PORT:8081}

spring:
  application:
    name: talentpulse-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# Firebase configuration
firebase:
  # Path to your service account key JSON downloaded from Firebase Console
  # Go to: Firebase Console → Project Settings → Service Accounts → Generate New Private Key
  service-account-path: classpath:firebase-service-account.json
  # OR use environment variable: GOOGLE_APPLICATION_CREDENTIALS
  project-id: talentpulse-f1225

# CORS - allow frontend dev server
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5500"
    - "http://localhost:5500"
    - "null"  # Allow file:// origin for local dev

# Google Form Webhook Security
google:
  webhook:
    secret: ${GOOGLE_WEBHOOK_SECRET:talentpulse-secret-key}

# Logging
logging:
  level:
    com.recruitx: DEBUG
    org.springframework.security: DEBUG


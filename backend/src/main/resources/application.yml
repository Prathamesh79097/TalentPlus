server:
  port: ${PORT:8081}

spring:
  application:
    name: talentpulse-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:talentpulseteam@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:gtzlvymqsvpkvqtk}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Firebase configuration
firebase:
  # Path to your service account key JSON downloaded from Firebase Console
  service-account-path: classpath:firebase-service-account.json
  project-id: talentpulse-f1225

# CORS - allow frontend dev server
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5500"
    - "http://localhost:5500"
    - "null"  # Allow file:// origin for local dev

# Google Form Webhook Security
google:
  webhook:
    secret: ${GOOGLE_WEBHOOK_SECRET:talentpulse-secret-key}

# App custom mail settings
app:
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from-email: ${APP_MAIL_FROM:talentpulseteam@gmail.com}
    from-name: ${APP_MAIL_FROM_NAME:TalentPulseTeam}

# Logging
logging:
  level:
    com.recruitx: DEBUG
    org.springframework.security: DEBUG
